<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Priyanshu Kumar, Full Stack Engineer. Production apps, end to end.">
<title>Priyanshu Kumar · Full Stack Engineer</title>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width=".6" opacity=".45"/></pattern>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".18"/></pattern>
<radialGradient id="glow" cx="80%" cy="50%" r="45%"><stop offset="0" stop-color="#3fb950" stop-opacity=".09"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
<linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".55" stop-color="#0d1117" stop-opacity=".6"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.5"/></filter>
<clipPath id="card"><rect width="1000" height="330" rx="12"/></clipPath>
</defs>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.typed{animation:typed 1.1s steps(11,end) .7s both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.dash{animation:flow 1.6s linear infinite}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes typed{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% 0 -20% 0)}}
@keyframes blink{50%{fill-opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
@keyframes flow{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
