name: Refresh dashboard

on:
  schedule:
    - cron: "7 * * * *"   # hourly so today's commits show up the same day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/dashboard.py", "assets/fog-portrait.png", ".github/workflows/dashboard.yml"]

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/dashboard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg docs/index.html
          git diff --cached --quiet || (git commit -m "chore: refresh dashboard" && git pull --rebase && git push)
